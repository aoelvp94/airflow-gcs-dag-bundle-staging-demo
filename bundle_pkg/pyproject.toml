[project]
name = "gcs-archive-dag-bundle"
version = "0.1.0"
description = "Vendored GCSArchiveDagBundle until apache-airflow-providers-google ships airflow.providers.google.cloud.bundles.gcs.GCSArchiveDagBundle"
requires-python = ">=3.11"
# The provider is installed separately (see the Dockerfile). Declaring it
# here would pull the full Google provider, including Ray and every product
# client, which this bundle class does not import.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
